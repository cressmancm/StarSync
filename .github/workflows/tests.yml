# Builds and tests StarSyncCore, the pure-Swift half.
#
# The app target needs the macOS 27 SDK for PHAsset.rating, and GitHub's
# hosted runners don't ship Xcode 27 yet, so it can't be built here. Core
# targets macOS 14 and carries all the logic worth testing. Add an app build
# step once a runner with Xcode 27 is available.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: StarSyncCore
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        working-directory: StarSyncCore
        run: swift build --build-tests

      - name: Test
        working-directory: StarSyncCore
        run: swift test

  fixture:
    name: Fixture matches the generator
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The committed fixture must hold what the generator produces, so a
      # change to one is never silently out of step with the other.
      #
      # Contents, not bytes. A SQLite file header carries the version number
      # of the library that wrote it, so two correct runs on machines with
      # different SQLite versions produce different files holding identical
      # data — which is exactly what a byte comparison here used to fail on.
      - name: The committed fixture must match the generator
        working-directory: StarSyncCore/Tests/StarSyncCoreTests/Fixtures
        run: python3 make-fixture.py --verify

      - name: Test
        working-directory: StarSyncCore
        run: swift test
